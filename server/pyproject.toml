[project]
name = "nowrecommend-server"
version = "0.1.0"
description = "지금 추천 API 서버 — 카탈로그, 유사도 검색, AI 재순위"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.10",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx2>=2.14"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running PostgreSQL (set NOWREC_DB_TESTS=1)"]

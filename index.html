<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f4f6" />
    <meta name="description" content="평소 취향과 지금의 상황을 함께 담아, 음식과 음악을 추천하는 지금 추천." />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- Pretendard (OFL). If it fails to load, the system Korean fonts in styles.css take over. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <style>html,body{background:#f2f4f6;color:#191f28;color-scheme:light}html[data-theme=dark],html[data-theme=dark] body{background:#131417;color:#f2f4f6;color-scheme:dark}</style>
    <script>try{const a=JSON.parse(localStorage.getItem('nowrecommend-prototype-v1')||'null')?.appearance;const dark=a?.mode==='dark'||a?.mode==='system'&&matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('meta[name="theme-color"]').content=dark?'#131417':'#f2f4f6';}catch{}</script>
    <title>지금 추천 — 오늘의 선택, 지금의 나답게</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

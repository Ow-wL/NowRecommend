<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101114" />
    <meta name="description" content="평소 취향과 지금의 상황을 함께 담아, 음식과 음악을 추천하는 지금 추천." />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <style>html,body{background:#101114;color:#F5F5F7;color-scheme:dark}html[data-theme=light],html[data-theme=light] body{background:#f4f6f8;color:#17202d;color-scheme:light}</style>
    <script>try{const a=JSON.parse(localStorage.getItem('nowrecommend-prototype-v1')||'null')?.appearance;const light=a?.mode==='light'||a?.mode==='system'&&!matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.dataset.theme=light?'light':'dark';document.querySelector('meta[name="theme-color"]').content=light?'#f4f6f8':'#101114';}catch{}</script>
    <title>지금 추천 — 오늘의 선택, 지금의 나답게</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

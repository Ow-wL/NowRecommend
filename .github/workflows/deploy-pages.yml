name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Install dependencies
        run: npm ci
      - name: Verify recommendation rules
        run: npm test
      # A push to main is a release: the browser tests and the built-site checks (security policy, icons, offline
      # cache) must pass before anything is published. The same steps as frontend-ci.yml.
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests (dev server)
        env:
          PW_CHANNEL: chromium
        run: npx playwright test
      - name: Browser tests (built site)
        env:
          PW_CHANNEL: chromium
          VITE_API_BASE_URL: http://127.0.0.1:5999
          VITE_RELEASE: ${{ github.sha }}
        run: npm run build && npm run test:dist
      - name: Build site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Repository variable (Settings → Secrets and variables → Actions → Variables). Unset → offline mode
          # with the bundled catalog, exactly as before. Must be an https origin (Pages is served over https).
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # The build's name in error reports and in the offline cache, and where the site is served (link previews).
          VITE_RELEASE: ${{ github.sha }}
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
          # Who runs the service and where to write (src/legal.ts): shown in the terms and the privacy policy. Both must
          # be set before a public launch; while they are missing the documents say that they are.
          VITE_OPERATOR_NAME: ${{ vars.VITE_OPERATOR_NAME }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          # Parts that depend on another company's terms (src/features.ts): VITE_WEATHER=off hides the weather button,
          # VITE_OPEN_METEO_KEY switches it to the paid API, VITE_APPLE_PREVIEWS=off removes the 30-second previews
          # (and Apple Music's player with them), VITE_APPLE_EMBED=off removes only that player.
          VITE_WEATHER: ${{ vars.VITE_WEATHER }}
          VITE_OPEN_METEO_KEY: ${{ vars.VITE_OPEN_METEO_KEY }}
          VITE_APPLE_PREVIEWS: ${{ vars.VITE_APPLE_PREVIEWS }}
          VITE_APPLE_EMBED: ${{ vars.VITE_APPLE_EMBED }}
        run: npm run build -- --base="${PAGES_BASE_PATH}/"
      - name: Upload static website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

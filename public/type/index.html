<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- A shared type link (2026-11-29, src/typeCard.ts): link previews do not read what follows # in an address, so the
         type test gets a page of its own whose preview is the type picture (public/og-type.png). It sends the person on to
         the app at once with the same ?t=... ; the build fills in __PUBLIC_URL__ (vite.config.ts). -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>당신은 음식·음악 어떤 유형인가요? — 지금 추천</title>
    <meta name="description" content="3분이면 나만의 네 글자 유형이 나와요. 친구와 궁합도 바로 확인해 보세요." />
    <meta name="robots" content="noindex" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="지금 추천" />
    <meta property="og:title" content="당신은 음식·음악 어떤 유형인가요? — 지금 추천" />
    <meta property="og:description" content="3분이면 나만의 네 글자 유형이 나와요. 친구와 궁합도 바로 확인해 보세요." />
    <meta property="og:url" content="__PUBLIC_URL__type/" />
    <meta property="og:image" content="__PUBLIC_URL__og-type.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>location.replace('../' + location.search + (location.hash || '#/type'));</script>
  </head>
  <body>
    <p><a href="../#/type">취향 유형 테스트로 가기</a></p>
  </body>
</html>

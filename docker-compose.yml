# Local development stack: PostgreSQL + pgvector and the FastAPI server.
# Credentials are local-only defaults; override with environment variables or a root .env file.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nowrecommend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nowrecommend}
      POSTGRES_DB: ${POSTGRES_DB:-nowrecommend}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nowrecommend}:${POSTGRES_PASSWORD:-nowrecommend}@db:5432/${POSTGRES_DB:-nowrecommend}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.6-flash}
      RERANK_ENABLED: ${RERANK_ENABLED:-true}
      LAB_FREE_MODELS: '${LAB_FREE_MODELS:-["gemini-3.5-flash-lite","gemini-3.6-flash"]}'
      PARSE_ENABLED: ${PARSE_ENABLED:-true}
      RERANK_TIMEOUT_MS: ${RERANK_TIMEOUT_MS:-10000}
      LOG_RAW_TEXT: ${LOG_RAW_TEXT:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://127.0.0.1:5173","http://localhost:5173","https://ow-wl.github.io"]}'
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    volumes:
      # Names files and review exports for app.cli.draft / app.cli.review (not committed).
      - ./server/data/drafts:/srv/server/data/drafts
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
